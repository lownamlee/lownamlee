<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title description">
  <title id="title">README compatibility lab light-mode animation</title>
  <desc id="description">A blue dot moves along a track beneath text identifying the light-mode animated asset.</desc>
  <rect width="720" height="160" rx="18" fill="#f6f8fa"/>
  <rect x="1" y="1" width="718" height="158" rx="17" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <text x="36" y="52" fill="#1f2328" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Testing Testing 123</text>
  <text x="36" y="82" fill="#59636e" font-family="Arial, Helvetica, sans-serif" font-size="16">Light theme · animated SVG · declarative motion</text>
  <line x1="48" y1="118" x2="672" y2="118" stroke="#afb8c1" stroke-width="8" stroke-linecap="round"/>
  <circle cx="58" cy="118" r="13" fill="#0969da">
    <animate attributeName="cx" values="58;662;58" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
